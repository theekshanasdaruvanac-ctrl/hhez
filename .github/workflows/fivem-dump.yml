# language: YAML, file: .github/workflows/fivem-dump.yml
# Keeps the signature table in step with FiveM's own build cadence.
#
# detect -> dump -> pull-request
#
# "detect" is a cheap scheduled job that asks the public artifact index whether
# a new server build exists. It compares against state/last-seen-build.txt, which
# lives in the repository rather than in a runner cache: it is reviewable, it
# cannot expire, and the pull request that carries a table update also records
# which build produced it.
name: fivem-dump

on:
  schedule:
    # every two hours, a few minutes past the hour so the index has settled
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "run even when no new build was detected"
        type: boolean
        default: false
      build:
        description: "specific build number (blank = latest)"
        type: string
        default: ""
  push:
    paths:
      - "seeds/**"
      - "tables/**"
      - ".github/workflows/fivem-dump.yml"
    branches: [main]

permissions:
  contents: read

env:
  BUILDS_URL: https://runtime.fivem.net/artifacts/fivem/builds.json

jobs:
  # ------------------------------------------------------------------ detect
  detect:
    name: detect FiveM update
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: read the last build we processed
        id: previous
        run: |
          if [[ -f state/last-seen-build.txt ]]; then
            echo "build=$(tr -d '[:space:]' < state/last-seen-build.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "build=" >> "$GITHUB_OUTPUT"
          fi

      - name: query the artifact index
        id: latest
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "$BUILDS_URL" -o builds.json
          LATEST="$(jq -r '[.server[]? | .build // .version // empty][0] // empty' builds.json)"
          LINK="$(jq -r  '[.server[]? | .link // empty][0] // empty' builds.json)"
          if [[ -z "$LATEST" || -z "$LINK" ]]; then
            echo "::error::the artifact index has no server entries"
            exit 1
          fi
          {
            echo "build=$LATEST"
            echo "link=$LINK"
          } >> "$GITHUB_OUTPUT"
          echo "latest server build: $LATEST"

      - name: decide whether there is work to do
        id: check
        run: |
          PREVIOUS="${{ steps.previous.outputs.build }}"
          LATEST="${{ steps.latest.outputs.build }}"
          REQUESTED="${{ inputs.build }}"
          FORCE="${{ inputs.force }}"

          if [[ -n "$REQUESTED" ]]; then
            BUILD="$REQUESTED"
            echo "run=true"  >> "$GITHUB_OUTPUT"
          elif [[ "$FORCE" == "true" ]]; then
            BUILD="$LATEST"
            echo "run=true"  >> "$GITHUB_OUTPUT"
          elif [[ -z "$PREVIOUS" ]]; then
            BUILD="$LATEST"
            echo "run=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::no previous build recorded, seeding the table"
          elif [[ "$LATEST" != "$PREVIOUS" ]]; then
            BUILD="$LATEST"
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            BUILD="$LATEST"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::already on build $LATEST, nothing to do"
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------- dump
  dump:
    name: dump signatures
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: build the dumper
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFIVEM_BUILD_TESTS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: fetch the FiveM artifact
        run: |
          chmod +x tools/fetch_fivem.sh
          ./tools/fetch_fivem.sh artifacts "${{ needs.detect.outputs.build }}"

      - name: emit a signature table from the seed list
        run: |
          mkdir -p tables
          build/fivem-dump emit-seed \
            seeds/fivem.seed artifacts \
            tables/fivem.table \
            reports/seed-dump.md || {
              echo "::error::seed dump did not fully succeed; see the report"
              exit 2
            }

      - name: diff against the committed table
        id: diff
        run: |
          mkdir -p reports
          if [[ -f tables/fivem.table ]]; then
            echo "::notice::no committed table yet; this run seeds it"
            cp tables/fivem.table tables/fivem.next.table
            echo "status=seeded" >> "$GITHUB_OUTPUT"
          else
            set +e
            build/fivem-dump diff tables/fivem.table artifacts/citizen-scripting-v8node.dll \
              > reports/diff.txt 2>&1
            RC=$?
            set -e
            cat reports/diff.txt
            echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
            if [[ $RC -eq 0 ]]; then
              echo "status=unchanged" >> "$GITHUB_OUTPUT"
              cp tables/fivem.table tables/fivem.next.table
            else
              echo "status=changed" >> "$GITHUB_OUTPUT"
              # The per-module diff above is advisory. The table of record is
              # regenerated wholesale from the seeds, so it is always internally
              # consistent for the build that produced it.
              cp tables/fivem.table tables/fivem.next.table
            fi
          fi

      - name: record the build we processed
        run: echo "${{ needs.detect.outputs.build }}" > state/last-seen-build.txt

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dump-reports
          path: |
            reports/
            tables/
            artifacts/manifest.txt
          if-no-files-found: warn

  # ------------------------------------------------------------ pull request
  pull-request:
    name: open the update pull request
    needs: [detect, dump]
    if: always() && needs.detect.outputs.run == 'true' && needs.dump.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dump-reports
          path: incoming

      - name: open or update a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: fivem-dump/update
          base: main
          commit-message: |
            dump signatures for FiveM build ${{ needs.detect.outputs.build }}

            Regenerated from seeds/fivem.seed. The table carries AOB signatures
            rather than fixed offsets, so it survives a rebuild that only moves
            code; the diff report below records which symbols needed a human.
          title: "FiveM offsets for build ${{ needs.detect.outputs.build }}"
          body: |
            Automated dump for FiveM server build `${{ needs.detect.outputs.build }}`.

            ### What changed

            | | |
            |---|---|
            | symbols emitted | see `reports/seed-dump.md` |
            | table | `tables/fivem.table` |
            | diff against the previous table | `reports/diff.txt` |

            A symbol reported **vanished** means no surviving window of its
            signature could be found inside the function that owned it. That is a
            deliberate refusal to guess: the tool will not reattach a symbol to a
            lookalike elsewhere in the binary. Refresh the RVAs for those symbols
            in `seeds/fivem.seed` and re-run.

            **A symbol reported `moved` is fine** — the signature survived and
            resolved to a new address, which is exactly what these tables are for.
          labels: |
            automated
            offsets
          delete-branch: true
          add-paths: |
            tables/fivem.table
            state/last-seen-build.txt
          commit-changes: true
